# WX-84 Station Router - Genesys Cloud inbound message flow (Archy YAML)
#
# 1. Calls the "WX-84 Name Collector" bot, which asks the customer for their
#    last name, and attaches the answer as participant data "wx84.lastName".
# 2. Transfers every chat to the queue "WX-84 Weather Desk". Its members are the
#    group "WX-84 Agents", so any of those agents may get the chat.
#
# The station the customer picked travels with the chat as the Web Messaging
# custom attribute "location". It does not route: the WX-84 console reads it as
# context and checks whether the agent who took the chat is cleared for it.
#
# Deployed by genesys/setup.js through the Architect jobs API
# (POST /api/v2/flows/jobs) - no local Archy installation needed.
inboundShortMessage:
  name: WX-84 Station Router
  description: Sends every WX-84 customer chat to the WX-84 Weather Desk queue.
  division: Home
  startUpRef: "/inboundShortMessage/states/state[Route to the desk_10]"
  defaultLanguage: en-us
  supportedLanguages:
    en-us:
      defaultLanguageSkill:
        noValue: true
  settingsErrorHandling:
    errorHandling:
      disconnect:
        none: true
  states:
    - state:
        name: Route to the desk
        refId: Route to the desk_10
        variables:
          - stringVariable:
              name: State.lastName
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - stringVariable:
              name: State.botExitReason
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
        actions:
          # No inputText: the customer's first message must not become the slot value.
          - callDigitalBotFlow:
              name: Ask for the customer's last name
              inputText:
                noValue: true
              exitReason:
                var: State.botExitReason
              intent:
                noValue: true
              digitalBotFlow:
                WX-84 Name Collector:
                  ver_latestPublished:
                    outputs:
                      Flow.LastName:
                        var: State.lastName
          - setParticipantData:
              name: Attach last name to the conversation
              attributes:
                - attribute:
                    name:
                      lit: wx84.lastName
                    value:
                      exp: If(IsNotSetOrEmpty(State.lastName), "", State.lastName)
          - sendResponse:
              name: Greeting
              messageBody:
                lit: Thank you. Connecting you to the next available duty meteorologist.
          - transferToAcd:
              name: To the Weather Desk
              targetQueue:
                lit:
                  name: WX-84 Weather Desk
              priority:
                lit: 0
              preferredAgents:
                noValue: true
              languageSkill:
                noValue: true
          - disconnect:
              name: Disconnect
