<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WX-84 Genesys Link</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=VT323&display=swap">
  <link rel="stylesheet" href="/css/cockpit.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
    .panel { width: min(100%, 440px); padding: 26px 28px 30px; }
    .crt { padding: 16px 18px; font-size: 21px; line-height: 1.25; margin-top: 16px; min-height: 110px; }
    .crt.error { color: var(--red); text-shadow: 0 0 5px rgba(255,59,48,.7); }
  </style>
</head>
<body>
  <div class="panel">
    <h1 class="engraved" style="margin:0;font-size:15px">WX-84 · Genesys Cloud Link</h1>
    <div class="crt" id="out">&gt; LINKING_</div>
  </div>
  <script type="module">
    // Last stop of the Genesys sign-in. The WX-84 server has already traded the
    // one-time code for tokens (with its client secret) and handed the result to
    // the console under the handoff id; no token ever comes to this page. It only
    // reports the outcome:
    //   silent=1: a hidden iframe inside the console. On failure it tells the
    //             console at once, which then offers "Engage link".
    //   default:  the "Engage link" popup, which closes itself on success.
    const out = document.getElementById('out');
    const params = new URLSearchParams(location.search);
    const silent = params.get('silent') === '1';
    const ok = params.get('status') === 'ok';
    const message = (params.get('message') || 'SIGN-IN FAILED').slice(0, 300);
    history.replaceState(null, '', '/auth/popup.html'); // keep the address bar clean

    out.textContent = ok ? '> LINK ESTABLISHED. OPERATOR VERIFIED BY GENESYS CLOUD.' : `> ${message}`;
    out.classList.toggle('error', !ok);
    if (!ok && silent && window.parent !== window) {
      window.parent.postMessage({ wx84: 'silent-signin-failed', reason: message, status: Number(params.get('code')) || 0 }, location.origin);
    }
    if (ok && !silent) setTimeout(() => window.close(), 1200);
  </script>
</body>
</html>
